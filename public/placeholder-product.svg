<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c162c" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="neon-glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" />
  <circle cx="400" cy="380" r="320" fill="url(#neon-glow)" />

  <!-- Subtle Tech Grid Lines -->
  <path d="M 0 200 L 800 200 M 0 400 L 800 400 M 0 600 L 800 600 M 200 0 L 200 800 M 400 0 L 400 800 M 600 0 L 600 800"
        stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Central Frame -->
  <rect x="250" y="230" width="300" height="300" rx="36" fill="#0d1424" fill-opacity="0.6" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Gamepad / Icon -->
  <g transform="translate(325, 305)" filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M 25 35 C 25 20, 45 10, 75 10 C 105 10, 125 20, 125 35 C 135 65, 145 105, 125 125 C 115 135, 95 125, 85 105 C 80 95, 70 95, 65 105 C 55 125, 35 135, 25 125 C 5 105, 15 65, 25 35 Z"
          fill="none" stroke="#60a5fa" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
    <!-- D-Pad -->
    <path d="M 45 45 L 45 65 M 35 55 L 55 55" stroke="#93c5fd" stroke-width="4.5" stroke-linecap="round" />
    <!-- Action Buttons -->
    <circle cx="100" cy="48" r="4" fill="#f59e0b" />
    <circle cx="108" cy="56" r="4" fill="#ef4444" />
    <circle cx="92" cy="56" r="4" fill="#3b82f6" />
    <circle cx="100" cy="64" r="4" fill="#10b981" />
  </g>

  <!-- Typography / Brand -->
  <text x="400" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#e2e8f0">
    APERTA START
  </text>
  <text x="400" y="632" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#64748b">
    FOTO DO PRODUTO EM BREVE
  </text>
</svg>
