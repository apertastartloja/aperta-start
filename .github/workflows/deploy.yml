name: Deploy Lovable para VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build SPA
        run: npm run build

      - name: Deploy para VPS
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${{ secrets.VPS_PORT }}" \
            -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          BUILD_DIR="dist"
          TARGET_PATH="$(echo "${{ secrets.VPS_TARGET_DIR }}" | tr -d '\r' | xargs)"
          TARGET_PATH="${TARGET_PATH%/}"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            "$BUILD_DIR/" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$TARGET_PATH/"
